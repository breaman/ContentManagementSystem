name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ContentManagementSystem.Server/package-lock.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ContentManagementSystem.slnx

      # site.css is generated from SCSS and is not committed, so the published output would be
      # missing its stylesheet without this step.
      - name: Build stylesheets
        working-directory: src/ContentManagementSystem.Server
        run: |
          npm ci
          npm run sass-prod

      # TreatWarningsAsErrors is on solution-wide, so a new warning fails here (criterion P0 #2).
      - name: Build
        run: dotnet build ContentManagementSystem.slnx --no-restore --configuration Release

      - name: Publish server
        run: >-
          dotnet publish src/ContentManagementSystem.Server/ContentManagementSystem.Server.csproj
          --no-build --configuration Release --output ${{ runner.temp }}/publish

      - name: Upload published server
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: ${{ runner.temp }}/publish
          retention-days: 7

  xss-corpus:
    name: XSS corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Its own job, and its own required check, for the same reason the migrations job is separate
      # from the integration suite: "can stored content execute in a visitor's browser" is the one
      # failure nobody should have to find among two hundred other red tests. Gap #11 is the
      # highest-severity item in the specification (task P1-20, acceptance criterion P1 #6).
      #
      # The suite writes what each profile stripped from each payload to the test log, because
      # over-stripping is the other failure mode (risk R3) and it has no attacker to catch it. TUnit
      # buffers that log per test rather than streaming it, so it rides in the uploaded TRX below
      # rather than appearing in the step output.
      #
      # The filter is a tree-node path — /assembly/namespace/class/test — and the alternation has to
      # sit inside one segment, since a bare `|` between two whole paths silently matches only the
      # first.
      - name: Sanitization and XSS corpus
        run: >-
          dotnet test --project tests/ContentManagementSystem.Core.Tests/ContentManagementSystem.Core.Tests.csproj
          --configuration Release
          --treenode-filter "/*/(ContentManagementSystem.Core.Tests.Security|ContentManagementSystem.Core.Tests.Content.Markdown)/*/*"
          --report-trx --report-trx-filename xss-corpus.trx
          --results-directory ${{ runner.temp }}/test-results
          --output Detailed

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xss-corpus-results
          path: ${{ runner.temp }}/test-results
          retention-days: 7

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test
        run: >-
          dotnet test --project tests/ContentManagementSystem.Core.Tests/ContentManagementSystem.Core.Tests.csproj
          --configuration Release
          --report-trx --report-trx-filename core.trx
          --results-directory ${{ runner.temp }}/test-results
          --coverage --coverage-output-format cobertura

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ${{ runner.temp }}/test-results
          retention-days: 7

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ContentManagementSystem.Server/package-lock.json

      # Testcontainers starts SQL Server itself; the runner only has to provide a Docker daemon,
      # which ubuntu-latest already does. The image is pinned in SqlServerImage rather than
      # floating on a tag, so a new upstream build cannot change behaviour under a green run.
      - name: Data integration tests
        run: >-
          dotnet test --project tests/ContentManagementSystem.Data.Tests/ContentManagementSystem.Data.Tests.csproj
          --configuration Release
          --report-trx --report-trx-filename data.trx
          --results-directory ${{ runner.temp }}/test-results

      # need to install the node dependencies so that the bootstrap.js file exists for the integration tests build
      - name: Install node dependencies
        working-directory: src/ContentManagementSystem.Server
        run: |
          npm ci

      - name: API and delivery integration tests
        run: >-
          dotnet test --project tests/ContentManagementSystem.Server.Tests/ContentManagementSystem.Server.Tests.csproj
          --configuration Release
          --report-trx --report-trx-filename server.trx
          --results-directory ${{ runner.temp }}/test-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ${{ runner.temp }}/test-results
          retention-days: 7

  migrations:
    name: Migrations apply from empty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Deliberately separate from the integration job. "Do the migrations apply to an empty
      # database, and do they revert?" is the one failure that blocks every deployment, so it gets
      # its own signal instead of being one red test among many.
      - name: Apply and revert every migration
        run: >-
          dotnet test --project tests/ContentManagementSystem.Data.Tests/ContentManagementSystem.Data.Tests.csproj
          --configuration Release
          --treenode-filter "/*/*/MigrationsApplyFromEmptyTests/*"

  accessibility:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Its own job and its own required check, for the reason the migrations job is separate: an
      # accessibility regression should not be one red test among many, because the usual response
      # to that is to disable the rule. The gate starts in Phase 1 against the structure screens
      # (task P1-31) rather than waiting for P9, so a screen is never merged inaccessible and fixed
      # later.
      #
      # It renders the components with the framework's static renderer and hands the markup to a
      # real browser, so it needs no database and no login and runs in seconds on every pull
      # request. The full-journey pass against the running site — including colour contrast, which
      # needs the compiled stylesheet — is P9's.
      - name: Structure screen accessibility
        run: >-
          dotnet test --project tests/ContentManagementSystem.E2E.Tests/ContentManagementSystem.E2E.Tests.csproj
          --configuration Release
          --treenode-filter "/*/*/StructureScreenAccessibilityTests/*"
          --report-trx --report-trx-filename accessibility.trx
          --results-directory ${{ runner.temp }}/test-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-results
          path: ${{ runner.temp }}/test-results
          retention-days: 7

  e2e-tests:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ContentManagementSystem.Server/package-lock.json

      - name: Build stylesheets
        working-directory: src/ContentManagementSystem.Server
        run: |
          npm ci
          npm run sass-prod

      # Browsers install themselves on first use (see PlaywrightBrowsers), so no PowerShell step.
      # axe-core assertions run inside these same browser journeys — the accessibility gate starts
      # in Phase 1 against the structure screens, not at the end of the project.
      - name: Test
        run: >-
          dotnet test --project tests/ContentManagementSystem.E2E.Tests/ContentManagementSystem.E2E.Tests.csproj
          --configuration Release
          --report-trx
          --results-directory ${{ runner.temp }}/test-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            ${{ runner.temp }}/test-results
            tests/ContentManagementSystem.E2E.Tests/**/playwright-traces/**
          retention-days: 7
          if-no-files-found: ignore
